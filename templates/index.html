<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nextstop · Plan one decision at a time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf6f0; --card: #fffdf9; --text: #1f2a2e; --muted: #6b7570;
      --border: #ece4d8; --accent: #0f766e; --accent-dark: #115e59; --accent-soft: #e6f4f1;
      --sand: #f3ebdf; --warn-bg: #fff4e6; --warn-text: #9a3f12; --warn-border: #fbd9b4;
      --done: #166534; --done-bg: #ecf7ee; --done-border: #c7e8cf;
      --shadow: 0 1px 2px rgba(60, 40, 20, .05), 0 4px 16px rgba(60, 40, 20, .06);
      --shadow-lift: 0 2px 4px rgba(60, 40, 20, .06), 0 10px 28px rgba(60, 40, 20, .10);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); line-height: 1.55; -webkit-font-smoothing: antialiased; }
    .container { max-width: 1080px; margin: 0 auto; padding: 28px 24px 80px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .logo { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--accent); }
    .logo .logo-mark { width: 34px; height: 34px; border-radius: 11px; background: var(--accent); color: #fff;
                 display: grid; place-items: center; font-size: 17px; box-shadow: var(--shadow); color: #fff; }
    .link-btn { background: none; border: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 14px;
                font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 6px 4px; }
    .link-btn:hover { color: var(--accent); }

    /* Trip progress bar */
    .progress { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
                padding: 16px 20px; margin-bottom: 22px; }
    .progress-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { font-size: 13.5px; padding: 6px 13px; border-radius: 999px; background: var(--sand); color: var(--muted);
            border: 1px solid transparent; display: inline-flex; align-items: center; gap: 6px; }
    .chip.done { background: var(--done-bg); border-color: var(--done-border); color: var(--done); font-weight: 700; }
    .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); font-weight: 700; }
    .chip .tag { font-weight: 600; opacity: .8; }

    .panel { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 32px; }
    h2 { margin: 0 0 4px; font-size: 24px; font-weight: 800; letter-spacing: -0.015em; }
    .sub { color: var(--muted); margin: 0 0 22px; }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px 20px; margin-bottom: 8px; }
    label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px; }
    label.field .icon { margin-right: 4px; }
    input[type=text], textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 12px;
                                 font: inherit; font-weight: 500; background: #fff; color: var(--text); transition: border-color .15s, box-shadow .15s; }
    input[type=text]::placeholder, textarea::placeholder { color: #a8a29a; }
    input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    textarea { resize: vertical; }
    .divider { border: none; border-top: 1px dashed var(--border); margin: 26px 0 22px; }
    .radios { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 8px; }
    .radios label { border: 1.5px solid var(--border); background: #fff; border-radius: 999px; padding: 8px 16px; cursor: pointer;
                    font-size: 14.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; transition: all .15s; }
    .radios label:hover { border-color: var(--accent); }
    .radios input { position: absolute; opacity: 0; pointer-events: none; }
    .radios label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }
    .radios label:has(input:focus-visible) { box-shadow: 0 0 0 4px var(--accent-soft); }

    .btn { background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 11px 22px;
           font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; transition: background .15s, transform .1s, box-shadow .15s; }
    .btn:hover:not(:disabled) { background: var(--accent-dark); box-shadow: var(--shadow); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-secondary { background: #fff; color: var(--accent-dark); border: 1.5px solid var(--accent); }
    .btn-secondary:hover:not(:disabled) { background: var(--accent-soft); }
    .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 22px; align-items: center; flex-wrap: wrap; }

    /* Option cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; align-items: start; }
    .card { background: var(--card); border: 2px solid transparent; border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
            display: flex; flex-direction: column; gap: 12px; transition: box-shadow .15s, border-color .15s; }
    .card:hover { box-shadow: var(--shadow-lift); }
    .card.checked { border-color: var(--accent); }
    .card-head { display: flex; gap: 12px; align-items: flex-start; }
    .card-head input { margin-top: 6px; width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
    .card h3 { margin: 0 0 4px; font-size: 18px; font-weight: 800; line-height: 1.3; }
    .cost { display: inline-block; font-weight: 800; color: var(--accent-dark); background: var(--accent-soft);
            border-radius: 999px; padding: 3px 11px; font-size: 14.5px; }
    .section-label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 2px; }
    .warn { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); border-radius: 12px; padding: 11px 14px; font-size: 14px; }
    .card .btn { margin-top: 4px; }
    .bullets { margin: 2px 0 0; padding-left: 18px; font-size: 14px; }
    .bullets li { margin-bottom: 4px; }
    .warn .bullets { margin-top: 4px; }
    details.more { border-top: 1px solid var(--border); padding-top: 8px; }
    details.more + details.more { border-top: none; padding-top: 0; }
    details.more summary { cursor: pointer; list-style: none; font-size: 13px; font-weight: 800; text-transform: uppercase;
                           letter-spacing: .07em; color: var(--accent-dark); padding: 4px 0; display: flex; align-items: center; gap: 6px; }
    details.more summary::-webkit-details-marker { display: none; }
    details.more summary::before { content: "▸"; transition: transform .15s; display: inline-block; }
    details.more[open] summary::before { transform: rotate(90deg); }
    details.more .bullets { margin-bottom: 6px; }

    /* Compare table */
    .table-wrap { overflow-x: auto; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; vertical-align: top; padding: 13px 14px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { font-size: 16px; font-weight: 800; background: var(--sand); }
    th:first-child { border-top-left-radius: 12px; } th:last-child { border-top-right-radius: 12px; }
    td:first-child { font-weight: 700; color: var(--muted); width: 160px; }
    tr.warn-row td { background: var(--warn-bg); }
    tr.warn-row td:not(:first-child) { color: var(--warn-text); }
    .tradeoff { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 12px; padding: 15px 18px; margin-top: 18px; }

    /* Next decision list */
    .next-item { display: flex; justify-content: space-between; align-items: center; gap: 16px; background: #fff;
                 border: 1.5px solid var(--border); border-radius: 14px; padding: 15px 18px; margin-bottom: 10px; }
    .next-item.top { border-color: var(--accent); background: var(--accent-soft); }
    .next-item strong { display: block; font-size: 16px; }
    .next-item .badge { display: inline-block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
                        background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: 2px; }

    .loading { text-align: center; padding: 56px; color: var(--muted); font-weight: 600; }
    .spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--accent);
               border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { background: #fdecec; color: #991b1b; border: 1px solid #f5c2c2; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-weight: 600; }
    .note { font-size: 12.5px; color: var(--muted); margin-top: 18px; text-align: center; }

    @media (max-width: 600px) {
      .container { padding: 20px 16px 60px; }
      .panel { padding: 22px 18px; }
      .next-item { flex-direction: column; align-items: stretch; }
    }
  </style>
  {% if posthog_key %}
  <!-- PostHog analytics: pageviews, clicks (autocapture), and session replay. Key comes from .env. -->
  <script>
  !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="init capture register register_once register_for_session unregister unregister_for_session getFeatureFlag getFeatureFlagPayload isFeatureEnabled reloadFeatureFlags updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures on onFeatureFlags onSessionId getSurveys getActiveMatchingSurveys renderSurvey canRenderSurvey getNextSurveyStep identify setPersonProperties group resetGroups setPersonPropertiesForFlags resetPersonPropertiesForFlags setGroupPropertiesForFlags resetGroupPropertiesForFlags reset get_distinct_id getGroups get_session_id get_session_replay_url alias set_config startSessionRecording stopSessionRecording sessionRecordingStarted captureException loadToolbar get_property getSessionProperty createPersonProfile opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing clear_opt_in_out_capturing debug".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
  posthog.init({{ posthog_key | tojson }}, { api_host: {{ posthog_host | tojson }}, person_profiles: 'identified_only' });

</head>
<body>
<div class="container">
  <header>
    <div class="logo"><span class="logo-mark" aria-hidden="true">✈︎</span><div>next<span>stop</span></div></div>
    <button class="link-btn" onclick="startOver()">Start over</button>
  </header>

  <div class="progress">
    <div class="progress-title">Your trip so far</div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="error"></div>
  <div id="screen"></div>
  <p class="note">Costs, flights, and dates are AI estimates, not live prices. Double-check before booking.</p>
</div>

<script>
  // Category keys and labels come from app.py so there is one source of truth.
  const CATEGORIES = {{ categories | tojson }};
  const SHORT = { where: "Where", when: "When", length: "Length", budget: "Budget",
                  transport: "Transport", stay: "Stay", activities: "Activities" };
  const ICON = { where: "📍", when: "🗓️", length: "⏳", budget: "💰",
                 transport: "✈️", stay: "🛏️", activities: "🥾" };
  const icon = (k) => `<span class="icon" aria-hidden="true">${ICON[k] || ""}</span>`;

  // The whole trip lives here in the browser. The server never stores it.
  // prefs = what the traveler wants going into each decision, e.g. prefs.stay = "quiet, kitchen".
  let trip = { origin: "", notes: "", decided: {}, prefs: {} };
  let deciding = null;   // category currently being decided
  let options = [];      // options returned for the current decision

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Render an AI field as a bullet list (accepts a list or a single string).
  const list = (items) => {
    const arr = (Array.isArray(items) ? items : [items]).filter(Boolean);
    return `<ul class="bullets">${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  };
  const bullets = (label, items) => items && items.length
    ? `<div><div class="section-label">${esc(label)}</div>${list(items)}</div>` : "";
  // A collapsible section on an option card (closed by default so 3 cards are easy to scan).
  const more = (label, items) => {
    const arr = (Array.isArray(items) ? items : [items]).filter(Boolean);
    return arr.length ? `<details class="more"><summary>${esc(label)}</summary>${list(arr)}</details>` : "";
  };
  const openCategories =() => Object.keys(CATEGORIES).filter(k => !trip.decided[k]);

  async function callApi(path, body) {
    $("error").innerHTML = "";
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || "Something went wrong.");
    return data;
  }

  function showError(err, retry) {
    if (retry) retry();  // re-render the previous screen first...
    $("error").innerHTML = `<div class="error">${esc(err.message)}</div>`;  // ...then show the error above it
  }

  function loading(text) {
    $("screen").innerHTML = `<div class="panel loading"><div class="spinner"></div>${esc(text)}</div>`;
  }

  function renderChips() {
    $("chips").innerHTML = Object.keys(CATEGORIES).map(k => {
      const val = trip.decided[k];
      const cls = val ? "chip done" : (k === deciding ? "chip active" : "chip");
      // Undecided categories show the preferences you gave, so you can see what the AI was told.
      const pref = !val && trip.prefs[k] ? `<span class="tag">· wants: ${esc(trip.prefs[k])}</span>` : "";
      const status = val ? "" : (k === deciding ? `<span class="tag">· deciding</span>` : "");
      return `<span class="${cls}">${icon(k)}${SHORT[k]}${val ? ": " + esc(val) : ""}${status}${pref}</span>`;
    }).join("");
  }

  // ---------- Screen 1: what do you know? ----------
  function showKnowns() {
    deciding = null;
    renderChips();
    const fields = Object.entries(CATEGORIES).map(([k, label]) => `
      <label class="field"><span>${icon(k)}${esc(label)}</span>
        <input type="text" id="known-${k}" value="${esc(trip.decided[k] || "")}" placeholder="Leave blank if you don't know yet" />
      </label>`).join("");
    const radios = Object.entries(CATEGORIES).map(([k]) => `
      <label><input type="radio" name="decide" value="${k}" />${icon(k)}${SHORT[k]}</label>`).join("");

    $("screen").innerHTML = `
      <div class="panel">
        <h2>What do you already know?</h2>
        <p class="sub">Fill in anything you've already settled. Leave the rest blank.</p>
        <div class="fields">
          <label class="field"><span><span class="icon" aria-hidden="true">🏠</span>Leaving from</span>
            <input type="text" id="origin" value="${esc(trip.origin)}" placeholder="e.g. New York" />
          </label>
          ${fields}
          <label class="field"><span><span class="icon" aria-hidden="true">📝</span>Anything else?</span>
            <input type="text" id="notes" value="${esc(trip.notes)}" placeholder="e.g. first time backpacking, traveling solo" />
          </label>
        </div>

        <hr class="divider" />
        <h2>What do you want to decide first?</h2>
        <p class="sub">Pick one of the things you left blank.</p>
        <div class="radios" id="radios">${radios}</div>

        <div class="actions"><button class="btn" onclick="submitKnowns()">Show me options →</button></div>
      </div>`;
  }

  function submitKnowns() {
    trip.origin = $("origin").value.trim();
    trip.notes = $("notes").value.trim();
    trip.decided = {};
    for (const k of Object.keys(CATEGORIES)) {
      const v = $("known-" + k).value.trim();
      if (v) trip.decided[k] = v;
    }
    const picked = document.querySelector('input[name="decide"]:checked');
    if (!picked) return showError(new Error("Pick what you want to decide first."));
    if (trip.decided[picked.value]) return showError(new Error(`You already filled in ${SHORT[picked.value]}. Clear it or pick something you haven't decided.`));
    showPrefs(picked.value);
  }

  // ---------- Screen 1b: preferences going into this one decision ----------
  const PREF_EXAMPLES = {
    where: "e.g. warm, not too touristy, good hiking, under 6 hours of flying",
    when: "e.g. avoid rainy season and holidays, can only take off in spring",
    length: "e.g. at most 10 days, don't want to use more than 5 PTO days",
    budget: "e.g. under $2,000 total, happy to spend more on lodging than food",
    transport: "e.g. nonstop if possible, no red-eyes, OK renting a car",
    stay: "e.g. quiet area, kitchen, walkable, under $80/night",
    activities: "e.g. one big hike, a lake day, no tours with big groups",
  };

  function showPrefs(category) {
    deciding = category;
    renderChips();
    $("error").innerHTML = "";
    $("screen").innerHTML = `
      <div class="panel">
        <h2>${ICON[category] || ""} Deciding: ${esc(CATEGORIES[category])}</h2>
        <p class="sub">Any preferences going into this decision? The AI will only suggest options that respect them.</p>
        <textarea id="prefs" rows="3" placeholder="${esc(PREF_EXAMPLES[category] || "")}">${esc(trip.prefs[category] || "")}</textarea>
        <div class="actions">
          <button class="link-btn" onclick="skipPrefs()">Skip</button>
          <button class="btn" onclick="submitPrefs()">Show me options →</button>
        </div>
      </div>`;
    $("prefs").focus();
  }

  function submitPrefs() {
    const text = $("prefs").value.trim();
    if (text) trip.prefs[deciding] = text; else delete trip.prefs[deciding];
    getOptions(deciding);
  }

  function skipPrefs() {
    delete trip.prefs[deciding];
    getOptions(deciding);
  }

  // ---------- Screen 2: options for one decision ----------
  async function getOptions(category) {
    deciding = category;
    renderChips();
    loading(`Finding options for ${SHORT[category]}…`);
    try {
      const data = await callApi("/api/options", { trip, decide: category });
      options = data.options || [];
      showOptions();
    } catch (err) { showError(err, showNext); }
  }

  function showOptions() {
    const cards = options.map((o, i) => `
      <div class="card" id="card-${i}">
        <div class="card-head">
          <input type="checkbox" class="pick" data-i="${i}" onchange="updateCompare()" />
          <div><h3>${esc(o.name)}</h3><div class="cost">${esc(o.estimated_cost)}</div></div>
        </div>
        ${bullets("Why it fits you", o.why_it_fits)}
        <div class="warn"><strong>⚠ Watch out for</strong>${list(o.watch_out)}</div>
        <div>
          ${more("Cost breakdown", o.cost_breakdown)}
          ${more("Trip at a glance", o.trip_summary || o.summary)}
        </div>
        <button class="btn btn-secondary" onclick="lockIn(${JSON.stringify(o.name).replace(/"/g, "&quot;")})">Lock this in</button>
      </div>`).join("");

    $("screen").innerHTML = `
      <div class="panel" style="margin-bottom:16px">
        <h2>${ICON[deciding] || ""} Your options for ${esc(CATEGORIES[deciding])}</h2>
        <p class="sub" style="margin:0">Lock one in, or check 2–3 to compare the whole trip each would lead to.</p>
      </div>
      <div class="cards">${cards}</div>
      <div class="actions">
        <span id="compare-hint" class="sub" style="margin:0">Check 2–3 options</span>
        <button class="btn" id="compare-btn" disabled onclick="compare()">Compare the full picture →</button>
      </div>`;
  }

  function checkedOptions() {
    return [...document.querySelectorAll(".pick:checked")].map(el => options[+el.dataset.i].name);
  }

  function updateCompare() {
    document.querySelectorAll(".pick").forEach(el => $("card-" + el.dataset.i).classList.toggle("checked", el.checked));
    const n = checkedOptions().length;
    $("compare-btn").disabled = n < 2 || n > 3;
    $("compare-hint").textContent = n > 3 ? "Pick at most 3" : `${n} selected`;
  }

  // ---------- Screen 3: the full picture ----------
  async function compare() {
    const picked = checkedOptions();
    loading(`Looking ahead at the whole trip for ${picked.join(" vs. ")}…`);
    try {
      const data = await callApi("/api/compare", { trip, decide: deciding, options: picked });
      showCompare(data, picked);
    } catch (err) { showError(err, showOptions); }
  }

  function showCompare(data, picked) {
    const cols = picked;  // always use the user's exact option names as column headers
    const head = `<tr><th></th>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>`;
    const rows = (data.rows || []).map(r => `
      <tr class="${/watch/i.test(r.label) ? "warn-row" : ""}">
        <td>${/watch/i.test(r.label) ? "⚠ " : ""}${esc(r.label)}</td>
        ${(r.values || []).map(v => `<td>${esc(v)}</td>`).join("")}
      </tr>`).join("");
    const lockButtons = picked.map(name =>
      `<button class="btn" onclick="lockIn(${JSON.stringify(name).replace(/"/g, "&quot;")})">Lock ${esc(name)}</button>`).join("");

    $("screen").innerHTML = `
      <div class="panel">
        <h2>The full picture</h2>
        <p class="sub">What the whole trip could look like with each choice.</p>
        <div class="table-wrap"><table>${head}${rows}</table></div>
        <div class="tradeoff"><strong>The trade-off:</strong> ${esc(data.tradeoff)}</div>
        <div class="actions">
          <button class="btn btn-secondary" onclick="showOptions()">← Back to options</button>
          ${lockButtons}
        </div>
      </div>`;
  }

  // ---------- Lock a decision, then Screen 4: what's next? ----------
  function lockIn(name) {
    trip.decided[deciding] = name;
    deciding = null;
    showNext();
  }

  async function showNext() {
    renderChips();
    if (openCategories().length === 0) return showDone();
    loading("Figuring out what to decide next…");
    let suggestions = [];
    try {
      suggestions = (await callApi("/api/next", { trip })).suggestions || [];
    } catch (err) { $("error").innerHTML = `<div class="error">${esc(err.message)}</div>`; }

    // Show AI-ranked suggestions first, then any open categories the AI missed.
    const ranked = suggestions.filter(s => CATEGORIES[s.category] && !trip.decided[s.category]);
    for (const k of openCategories()) {
      if (!ranked.some(s => s.category === k)) ranked.push({ category: k, reason: "" });
    }
    const items = ranked.map((s, i) => `
      <div class="next-item ${i === 0 ? "top" : ""}">
        <div><strong>${ICON[s.category] || ""} ${esc(CATEGORIES[s.category])}${i === 0 ? `<span class="badge">Suggested</span>` : ""}</strong>
          <span class="sub" style="margin:0">${esc(s.reason)}</span></div>
        <button class="btn ${i === 0 ? "" : "btn-secondary"}" onclick="showPrefs('${s.category}')">Decide</button>
      </div>`).join("");

    $("screen").innerHTML = `
      <div class="panel">
        <h2>What should you decide next?</h2>
        <p class="sub">Suggested order. You make the call.</p>
        ${items}
        <div class="actions"><button class="link-btn" onclick="showKnowns()">Edit what I know</button></div>
      </div>`;
  }

  function showDone() {
    const rows = Object.entries(CATEGORIES).map(([k, label]) =>
      `<tr><td>${ICON[k] || ""} ${esc(label)}</td><td>${esc(trip.decided[k])}</td></tr>`).join("");
    $("screen").innerHTML = `
      <div class="panel">
        <h2>Your trip is planned 🎉</h2>
        <p class="sub">Every decision is locked in.</p>
        <div class="table-wrap"><table>${trip.origin ? `<tr><td>🏠 Leaving from</td><td>${esc(trip.origin)}</td></tr>` : ""}${rows}</table></div>
        <div class="actions"><button class="btn btn-secondary" onclick="showKnowns()">Edit</button></div>
      </div>`;
  }

  function startOver() {
    trip = { origin: "", notes: "", decided: {}, prefs: {} };
    showKnowns();
  }

  showKnowns();
</script>
</body>
</html>
