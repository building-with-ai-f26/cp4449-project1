<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nextstop · Trip Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f5f4; --card: #fff; --text: #1f2a2e; --muted: #6b7570; --line: #d6d3d1; --ink: #2b2b2b;
      --accent: #0f766e; --accent-dark: #115e59; --accent-soft: #e6f4f1;
      --warn-text: #9a3f12; --warn-bg: #fff4e6;
      --s1: #a8a29e; --s2: #d97706; --s3: #15803d;
      --day-w: 138px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           color: var(--text); line-height: 1.45; -webkit-font-smoothing: antialiased; background: var(--bg); }
    header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 4px; gap: 12px; flex-wrap: wrap; }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--accent); }
    .logo .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; }
    .link-btn { background: none; border: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 13px;
                font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 2px; }
    .link-btn:hover { color: var(--accent); }
    .wrap { padding: 8px 24px 60px; max-width: 1500px; margin: 0 auto; }
    h1 { font-size: 26px; margin: 6px 0 2px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
    .demo { display: inline-block; background: var(--warn-bg); color: var(--warn-text); font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; margin-left: 8px; vertical-align: 4px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }

    /* Decision cards */
    .decisions { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin-bottom: 22px; }
    .dcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
    .dcard:hover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .dcard .t { font-weight: 800; font-size: 14px; }
    .dcard .p { font-size: 13px; margin-top: 2px; }
    .stage { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; margin-top: 6px; }
    .dots { display: inline-flex; gap: 3px; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
    .stage.s1 { color: var(--s1); } .stage.s1 .dots i:nth-child(-n+1) { background: var(--s1); }
    .stage.s2 { color: var(--s2); } .stage.s2 .dots i:nth-child(-n+2) { background: var(--s2); }
    .stage.s3 { color: var(--s3); } .stage.s3 .dots i { background: var(--s3); }

    /* Main: calendar + side panel */
    .main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .legend .sw { display: inline-block; width: 18px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1.5px dashed var(--ink); }
    .legend .sw.solid { border-style: solid; background: var(--accent-soft); }

    .cal-scroll { overflow-x: auto; padding-bottom: 6px; }
    .cal { display: grid; grid-auto-columns: var(--day-w); column-gap: 8px; row-gap: 8px; width: max-content; }
    .stop { border-radius: 8px; padding: 5px 9px; font-weight: 800; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
    .stop .n { font-weight: 600; font-size: 11.5px; opacity: .8; }
    .dhead { text-align: center; font-size: 12px; color: var(--muted); }
    .dhead b { display: block; color: var(--text); font-size: 13px; }
    .daycol { display: flex; flex-direction: column; gap: 7px; min-height: 170px; background: rgba(255,255,255,.55); border-radius: 8px; padding: 6px; }
    .item { background: #fff; border: 1.5px dashed var(--ink); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; cursor: pointer; position: relative; }
    .item .c { color: var(--muted); font-size: 11px; }
    .item.locked { padding-right: 20px; border-style: solid; background: var(--accent-soft); border-color: var(--accent); }
    .item.locked::after { content: "🔒"; position: absolute; top: 4px; right: 6px; font-size: 10px; }
    .item.flight { background: #eef6ff; }
    .item.flight.locked { background: #dbeafe; border-color: #2563eb; }
    .stay { border-radius: 8px; padding: 6px 9px; font-size: 12px; border: 1.5px dashed var(--ink); background: #fff; cursor: pointer; position: relative; }
    .stay.locked { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
    .stay.locked::after { content: "🔒"; position: absolute; top: 5px; right: 8px; font-size: 10px; }
    .stay.missing { border-color: var(--s2); color: var(--warn-text); background: var(--warn-bg); cursor: default; }
    .rowlabel { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; align-self: center; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

    /* Side panel */
    .side { display: flex; flex-direction: column; gap: 14px; }
    .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 2px 0; }
    .row .m { color: var(--muted); font-size: 11.5px; }
    .total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; font-weight: 800; }
    .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; }
    .bar i { display: block; height: 100%; background: var(--accent); }
    .bar.over i { background: #dc2626; }
    .tbd { color: var(--warn-text); }
    .next { font-size: 13px; padding: 8px 10px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-text); margin-bottom: 6px; }
    .next b { display: block; color: var(--text); }
    ul.rough { margin: 0; padding-left: 18px; font-size: 13px; }
    ul.rough li { margin-bottom: 4px; }
    ul.rough .tag { color: var(--muted); font-size: 11px; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
    #toast.on { opacity: 1; }
    @media (max-width: 600px) { header, .wrap { padding-left: 16px; padding-right: 16px; } }
  </style>
  {% if posthog_key %}
  <script>

  posthog.init({{ posthog_key | tojson }}, { api_host: {{ posthog_host | tojson }}, person_profiles: 'identified_only' });

</head>
<body>
  <header>
    <div class="logo"><span class="logo-mark" aria-hidden="true">✈︎</span><div>next<span>stop</span></div></div>
    <a class="link-btn" href="/">Step-by-step view</a>
  </header>

  <div class="wrap">
    <h1 id="trip-name"></h1>
    <div class="sub" id="trip-sub"></div>

    <h2>Decisions</h2>
    <div class="decisions" id="decisions"></div>

    <div class="main">
      <section class="panel">
        <h2>Calendar</h2>
        <div class="legend">
          <span><span class="sw"></span>Pencilled in (stage 2)</span>
          <span><span class="sw solid"></span>Locked in (stage 3) 🔒</span>
        </div>
        <div class="cal-scroll"><div class="cal" id="cal"></div></div>
        <div class="hint">Tip: click a card to lock or unlock it (demo only).</div>
      </section>

      <aside class="side">
        <section class="panel" id="budget"></section>
        <section class="panel" id="next"></section>
        <section class="panel" id="rough"></section>
      </aside>
    </div>
  </div>
  <div id="toast"></div>

<script>
  // PR 1: a FAKE sample trip so we can see the Trip Overview. No AI, no saving yet.
  // Shape: topics (stage 1/2/3 + pick), stops (sub-wheres), days (items), rough ideas.
  const TOPICS = [
    ["where", "Where"], ["dates", "Dates"], ["length", "How many days"], ["activities", "Activities"],
    ["stay", "Accommodations"], ["flights", "Flights"], ["budget", "Budget"],
  ];
  const STAGE_NAME = { 1: "Rough idea", 2: "Workshopping", 3: "Locked in" };

  const trip = {
    name: "Guatemala",
    start: "2027-04-10",
    budget: 1200,
    topics: {
      where:      { stage: 2, pick: "Antigua → Lake Atitlán → Tikal" },
      dates:      { stage: 2, pick: "Apr 10 – 18" },
      length:     { stage: 3, pick: "9 days" },
      activities: { stage: 2, pick: "6 picked" },
      stay:       { stage: 2, pick: "2 of 3 stops" },
      flights:    { stage: 2, pick: "JFK ⇄ GUA, $480" },
      budget:     { stage: 2, pick: "$1,200 total" },
    },
    stops: [
      { name: "Antigua",      color: "#fde68a", stay: { name: "Guesthouse near the main plaza", nightly: 45, locked: true } },
      { name: "Lake Atitlán", color: "#a5f3fc", stay: { name: "Lakeside cabin, San Marcos", nightly: 60, locked: false } },
      { name: "Tikal",        color: "#bbf7d0", stay: null },
    ],
    // one entry per day: which stop you sleep at, and what's pencilled in
    days: [
      { stop: 0, items: [{ title: "Fly JFK → Guatemala City", kind: "flight", cost: 240, locked: false }, { title: "Shuttle to Antigua", cost: 30 }] },
      { stop: 0, items: [{ title: "Walk the old town + cafés", cost: 20, locked: true }] },
      { stop: 0, items: [{ title: "Acatenango overnight hike", cost: 90 }] },
      { stop: 1, items: [{ title: "Hike down, shuttle to the lake", cost: 25 }] },
      { stop: 1, items: [{ title: "Kayak + swim", cost: 25 }] },
      { stop: 1, items: [{ title: "Indian Nose sunrise", cost: 15 }] },
      { stop: 2, items: [{ title: "Travel to Flores", cost: 60 }] },
      { stop: 2, items: [{ title: "Tikal ruins at sunrise", cost: 50 }] },
      { stop: 2, items: [{ title: "Fly home", kind: "flight", cost: 240, locked: false }] },
    ],
    rough: [
      { text: "Maybe a cooking class", topic: "Activities" },
      { text: "Chichicastenango market (Thu/Sun only)", topic: "Activities" },
      { text: "Semuc Champey? might be too far", topic: "Where" },
      { text: "Splurge one night somewhere nice", topic: "Budget" },
    ],
  };

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => "$" + Math.round(n).toLocaleString();
  function dayDate(i) {
    const d = new Date(trip.start + "T12:00:00");
    d.setDate(d.getDate() + i);
    return { wk: d.toLocaleDateString("en-US", { weekday: "short" }), md: d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) };
  }
  // nights at each stop = days you sleep there (the last day is travel home, no night)
  const nightsAt = (s) => trip.days.slice(0, -1).filter(d => d.stop === s).length;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200); }

  // ---------- render ----------
  function renderHeader() {
    $("trip-name").innerHTML = `${esc(trip.name)} trip <span class="demo">Sample trip · demo</span>`;
    const first = dayDate(0).md, last = dayDate(trip.days.length - 1).md;
    $("trip-sub").textContent = `${first} – ${last} · ${trip.days.length} days · ${trip.stops.length} stops`;
  }

  function renderDecisions() {
    $("decisions").innerHTML = TOPICS.map(([key, label]) => {
      const t = trip.topics[key];
      return `<button class="dcard" onclick="openTopic('${label}')">
        <div class="t">${esc(label)}</div>
        <div class="p">${esc(t.pick)}</div>
        <div class="stage s${t.stage}"><span class="dots"><i></i><i></i><i></i></span>${STAGE_NAME[t.stage]}</div>
      </button>`;
    }).join("");
  }

  function renderCalendar() {
    const n = trip.days.length;
    let html = "";
    // Row 1: stop labels spanning their days (from Where)
    let col = 1;
    while (col <= n) {
      const s = trip.days[col - 1].stop;
      let span = 1;
      while (col - 1 + span < n && trip.days[col - 1 + span].stop === s) span++;
      const stop = trip.stops[s];
      html += `<div class="stop" style="grid-row:1;grid-column:${col} / span ${span};background:${stop.color}">${esc(stop.name)}<span class="n">${nightsAt(s)} night${nightsAt(s) === 1 ? "" : "s"}</span></div>`;
      // Row 4: hotel strip under the same stop (from Accommodations)
      const st = stop.stay;
      html += st
        ? `<div class="stay ${st.locked ? "locked" : ""}" style="grid-row:4;grid-column:${col} / span ${span}" onclick="toggleStay(${s})">🛏 ${esc(st.name)} <span class="c">· ${money(st.nightly)}/night</span></div>`
        : `<div class="stay missing" style="grid-row:4;grid-column:${col} / span ${span}">🛏 No stay yet — research Accommodations</div>`;
      col += span;
    }
    // Row 2: dates (from Dates) · Row 3: the day's cards (from Activities + Flights)
    trip.days.forEach((d, i) => {
      const { wk, md } = dayDate(i);
      html += `<div class="dhead" style="grid-row:2;grid-column:${i + 1}"><b>Day ${i + 1}</b>${wk} ${md}</div>`;
      html += `<div class="daycol" style="grid-row:3;grid-column:${i + 1}">${d.items.map((it, j) => `
        <div class="item ${it.kind || ""} ${it.locked ? "locked" : ""}" onclick="toggleItem(${i},${j})">
          ${it.kind === "flight" ? "✈️ " : ""}${esc(it.title)}
          ${it.cost ? `<div class="c">~${money(it.cost)}</div>` : ""}
        </div>`).join("")}</div>`;
    });
    $("cal").innerHTML = html;
  }

  function costs() {
    const flights = trip.days.flatMap(d => d.items).filter(i => i.kind === "flight").reduce((a, i) => a + (i.cost || 0), 0);
    const acts = trip.days.flatMap(d => d.items).filter(i => i.kind !== "flight").reduce((a, i) => a + (i.cost || 0), 0);
    const stays = trip.stops.map((s, i) => ({ name: s.name, nights: nightsAt(i), nightly: s.stay?.nightly }));
    const stayTotal = stays.reduce((a, s) => a + (s.nightly ? s.nightly * s.nights : 0), 0);
    return { flights, acts, stays, stayTotal, total: flights + acts + stayTotal };
  }

  function renderBudget() {
    const c = costs();
    const pct = Math.min(100, (c.total / trip.budget) * 100);
    $("budget").innerHTML = `
      <h2>Budget</h2>
      <div class="row"><span>Flights</span><span>${money(c.flights)}</span></div>
      ${c.stays.map(s => `<div class="row"><span>Stay: ${esc(s.name)} <span class="m">${s.nights}n${s.nightly ? " × " + money(s.nightly) : ""}</span></span>
        <span class="${s.nightly ? "" : "tbd"}">${s.nightly ? money(s.nightly * s.nights) : "?"}</span></div>`).join("")}
      <div class="row"><span>Activities + transport</span><span>${money(c.acts)}</span></div>
      <div class="row total"><span>So far</span><span>${money(c.total)} of ${money(trip.budget)}</span></div>
      <div class="bar ${c.total > trip.budget ? "over" : ""}"><i style="width:${pct}%"></i></div>
      <div class="hint">${c.total > trip.budget ? "Over budget" : money(trip.budget - c.total) + " left"}${c.stays.some(s => !s.nightly) ? " · not counting stays you haven't picked" : ""}. Food not included yet.</div>`;
  }

  function renderNext() {
    const tips = [];
    trip.stops.forEach(s => { if (!s.stay) tips.push(["Accommodations", `${s.name} has no stay yet.`]); });
    if (trip.topics.dates.stage < 3 && trip.stops.some(s => !s.stay)) tips.push(["Dates", "Real prices for your dates show up once every stop has a stay."]);
    TOPICS.forEach(([k, label]) => { if (trip.topics[k].stage === 1) tips.push([label, "Still a rough idea."]); });
    $("next").innerHTML = `<h2>What to research next</h2>` +
      (tips.length ? tips.map(([t, why]) => `<div class="next"><b>${esc(t)}</b>${esc(why)}</div>`).join("") : `<div class="hint">Nothing urgent. Nice!</div>`);
  }

  function renderRough() {
    $("rough").innerHTML = `<h2>Rough ideas</h2><div class="hint" style="margin:-4px 0 8px">Stage 1: not on the calendar yet</div>
      <ul class="rough">${trip.rough.map(r => `<li>${esc(r.text)} <span class="tag">· ${esc(r.topic)}</span></li>`).join("")}</ul>`;
  }

  function render() { renderHeader(); renderDecisions(); renderCalendar(); renderBudget(); renderNext(); renderRough(); }

  // ---------- demo interactions ----------
  function toggleItem(i, j) { const it = trip.days[i].items[j]; it.locked = !it.locked; renderCalendar(); }
  function toggleStay(s) { const st = trip.stops[s].stay; st.locked = !st.locked; renderCalendar(); }
  function openTopic(label) { toast(`The ${label} research page comes in a later step.`); }

  render();
</script>
</body>
</html>
