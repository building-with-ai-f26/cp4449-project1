name: checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pip-audit
      - name: Unit + security tests (no AI calls, no API key needed)
        run: python -m unittest discover tests -v
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Secret scan
        run: |
          if git grep -nE 'sk-or-v1-[0-9a-f]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{10,}|sb_secret_|service_role' -- . ':!.github/workflows/checks.yml' ':!SECURITY.md'; then
            echo "Possible secret committed. Remove it and rotate the key." && exit 1
          fi
          echo "No secrets found."
